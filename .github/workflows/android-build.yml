name: Android CI (build + verify)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type: preview (default) or stable'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - stable

permissions:
  contents: read

env:
  # 应用版本号：与 android/app/build.gradle 的 versionName 保持一致。
  APP_VERSION: '0.3.4'

jobs:
  build:
    needs: [build-runners, build-rootfs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up JDK (pinned by README)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23.0.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.1.12297006"

      - name: Generate personal side-load keystore
        # 个人侧载构建：CI 内即时生成专用 keystore（别名 dsh-mobile，与 build.gradle
        # 环境变量路径期望的别名一致），通过环境变量交给 Gradle；keystore 作为
        # personal-keystore 构件上传，构建后必须立即下载备份。
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore dsh-mobile-personal.jks -storetype PKCS12 -alias dsh-mobile \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 'dsh-personal-2026' -keypass 'dsh-personal-2026' \
            -dname 'CN=DSH Personal, OU=Personal, O=Personal, L=Unknown, ST=Unknown, C=CN'
          echo "DSH_KEYSTORE_BASE64=$(base64 -w 0 dsh-mobile-personal.jks)" >> "$GITHUB_ENV"
          echo "DSH_KEYSTORE_PASSWORD=dsh-personal-2026" >> "$GITHUB_ENV"
          mkdir -p keystore-backup
          cp dsh-mobile-personal.jks keystore-backup/my-dsh-release.jks
      - name: Upload personal keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: personal-keystore
          path: keystore-backup/my-dsh-release.jks
          if-no-files-found: error

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle (tsc + vite)
        run: pnpm run build

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Official Harness frontend adapter tests
        run: pnpm --dir harness-web test

      - name: Install Shizuku plugin contract dependencies
        run: pnpm --dir scripts/runtime-profile install --frozen-lockfile --ignore-scripts

      - name: Audit shipped production dependencies
        run: |
          set -euo pipefail
          pnpm audit --prod --audit-level=high
          pnpm --dir scripts/runtime-profile audit --prod --audit-level=high

      - name: Script tests (node --test)
        run: pnpm run test:scripts

      - name: Runtime packaging self-check
        run: python3 scripts/build-embedded-runtime.selfcheck.py

      - name: Lint
        run: pnpm run lint

      - name: Capacitor sync
        run: pnpm run android:sync

      - name: Download PRoot runners (built by the toolchain job)
        uses: actions/download-artifact@v4
        with:
          name: proot-runners-arm64
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Verify runner placement
        run: ls -la android/app/src/main/jniLibs/arm64-v8a

      - name: Download embedded runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: embedded-runtime
          path: /tmp/embedded-runtime

      - name: Embed bundled runtime into APK (offline install)
        run: |
          set -euo pipefail
          BUNDLE="$(find /tmp/embedded-runtime -type f -name rootfs.bundle -print -quit)"
          MANIFEST="$(find /tmp/embedded-runtime -type f -name runtime-manifest.json -print -quit)"
          test -n "$BUNDLE" && test -f "$BUNDLE"
          test -n "$MANIFEST" && test -f "$MANIFEST"
          mkdir -p android/app/src/main/assets/runtime
          cp "$BUNDLE" android/app/src/main/assets/runtime/rootfs.bundle
          cp "$MANIFEST" android/app/src/main/assets/runtime/runtime-manifest.json
          ls -la android/app/src/main/assets/runtime/
          echo "Embedded rootfs bytes: $(stat -c%s android/app/src/main/assets/runtime/rootfs.bundle)"

      - name: Download runtime legal notices
        uses: actions/download-artifact@v4
        with:
          name: runtime-legal
          path: /tmp/runtime-legal

      - name: Install runtime legal notices into the APK assets
        run: |
          set -euo pipefail
          DEST=android/app/src/main/assets/legal/ubuntu-packages
          SRC=/tmp/runtime-legal
          test -d "$SRC"
          if [ -d "$SRC/ubuntu-packages" ] && [ ! -f "$SRC/inventory.json" ]; then
            SRC="$SRC/ubuntu-packages"
          fi
          mkdir -p "$DEST"
          cp -a "$SRC"/. "$DEST"/
          ls -la "$DEST"

      - name: Verify APK legal material for the network tool components
        run: |
          set -euo pipefail
          python3 scripts/legal-notices.py verify \
            --dest android/app/src/main/assets/legal/ubuntu-packages
          find android/app/src/main/assets/legal -maxdepth 2 -type f | sort

      - name: Set up Gradle (trusted distribution for wrapper bootstrap)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Generate Gradle wrapper (supply-chain bootstrap)
        working-directory: .wrapper-bootstrap
        run: gradle wrapper --no-daemon

      - name: Install wrapper jar into android project
        run: cp .wrapper-bootstrap/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar

      - name: Build release APK + lint + unit tests + instrumented test APK
        working-directory: android
        run: ./gradlew assembleRelease lintRelease testDebugUnitTest assembleDebugAndroidTest --no-daemon

      - name: Verify APK signature with apksigner (personal keystore)
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Verify the final APK bundled runtime integrity
        run: python3 scripts/verify-bundle.py --apk android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-harness-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-runners:
    name: Build PRoot runners (Operit2 toolchain, arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Operit2 at the pinned runtime toolchain commit
        uses: actions/checkout@v4
        with:
          repository: AAswordman/Operit2
          ref: dc4c3a9405dc7ed3ef69b2ac9a6ace65374d77cf
          path: operit2

      - name: Download pinned sources (busybox / termux-proot / talloc / bash)
        working-directory: operit2/tools/android-runtime
        run: |
          set -euo pipefail
          mkdir -p downloads sources
          fetch() {
            local name="$1" url_list="$2" archive="$3" sha="$4"
            echo "downloading $name"
            local ok=0
            local IFS=','
            for url in $url_list; do
              if curl -fL --retry 3 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o "downloads/$archive" "$url"; then
                ok=1
                break
              fi
              echo "mirror failed: $url" >&2
            done
            [ "$ok" -eq 1 ] || { echo "all mirrors failed for $name" >&2; exit 1; }
            echo "$sha  downloads/$archive" | sha256sum -c -
            tar -xf "downloads/$archive" -C sources
          }
          fetch busybox 'https://busybox.net/downloads/busybox-1.38.0.tar.bz2,https://sources.buildroot.net/busybox/busybox-1.38.0.tar.bz2' busybox-1.38.0.tar.bz2 34f9ea6ff8636f2c9241153b9114eefa9e65674a45318ae1ef95bb5f31c53bb2
          fetch proot https://github.com/termux/proot/archive/refs/tags/v5.1.107.78.tar.gz termux-proot-v5.1.107.78.tar.gz f3377ba49dcd833370420c34c5081b4c243ecbb85b2a9881a4f4586012599afa
          fetch talloc https://www.samba.org/ftp/talloc/talloc-2.4.3.tar.gz talloc-2.4.3.tar.gz dc46c40b9f46bb34dd97fe41f548b0e8b247b77a918576733c528e83abd854dd
          fetch bash 'https://ftp.gnu.org/gnu/bash/bash-5.2.37.tar.gz,https://mirrors.kernel.org/gnu/bash/bash-5.2.37.tar.gz' bash-5.2.37.tar.gz 9599b22ecd1d5787ad7d3b7bf0c59f312b3396d1e281175dd1f8a4014da621ff

      - name: Install NDK r29-beta4
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/operit-android-runtime"
          curl -fL --retry 3 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r29-beta4-linux.zip
          echo "c5db6031a549b5274eed920c45ee3c7da1ac3f1f416cbb512dd9d88417bdf009  /tmp/ndk.zip" | sha256sum -c -
          unzip -q /tmp/ndk.zip -d "$HOME/.cache/operit-android-runtime"

      - name: Build PRoot (arm64-v8a)
        working-directory: operit2
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          export OPERIT_ANDROID_RUNTIME_ABIS="arm64-v8a"
          export OPERIT_ANDROID_RUNTIME_COMPONENTS="proot"
          bash tools/android-runtime/build_android_tools_wsl.sh

      - name: Collect runners (renamed to dsh names)
        run: |
          mkdir -p runners
          cp operit2/apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so runners/libdsh_proot.so
          cp operit2/apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so runners/libdsh_proot_loader.so
          sha256sum runners/*

      - name: Package PRoot corresponding source
        run: |
          set -euo pipefail
          rm -rf proot-source /tmp/operit2-source.tar
          mkdir -p proot-source/upstream
          git -C operit2 archive --format=tar --prefix=operit2/ \
            dc4c3a9405dc7ed3ef69b2ac9a6ace65374d77cf \
            | gzip -n > proot-source/upstream/operit2-source.tar.gz
          cp operit2/tools/android-runtime/downloads/*.tar.* proot-source/upstream/
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf /tmp/proot-source.tar -C proot-source upstream
          gzip -n -c /tmp/proot-source.tar > proot-corresponding-source.tar.gz
          test -s proot-corresponding-source.tar.gz
          tar -tzf proot-corresponding-source.tar.gz | grep -x 'upstream/operit2-source.tar.gz' >/dev/null

      - name: Upload runners
        uses: actions/upload-artifact@v4
        with:
          name: proot-runners-arm64
          path: runners/*.so
          if-no-files-found: error

      - name: Upload PRoot corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: proot-corresponding-source
          path: proot-corresponding-source.tar.gz
          if-no-files-found: error

  build-rootfs:
    name: Build embedded runtime bundle (Ubuntu 24.04 ARM64 + Node 24.19 + dsh)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node 24.14.0 (arm64)
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Build Android-adapted official Harness frontend
        run: |
          pnpm install --frozen-lockfile --filter @dsh-mobile/harness-web...
          pnpm --dir harness-web build

      - name: Prepare dsh runtime for linux/arm64 (compile node-pty from source)
        run: |
          set -x
          set -o pipefail
          mkdir -p /tmp/dsh-root
          cp scripts/runtime-profile/package.json scripts/runtime-profile/pnpm-lock.yaml \
            scripts/runtime-profile/pnpm-workspace.yaml /tmp/dsh-root/
          cp -R scripts/runtime-profile/plugins /tmp/dsh-root/
          cp -R scripts/runtime-profile/patches /tmp/dsh-root/
          cd /tmp/dsh-root
          set +e
          (
            set -e
            pnpm install --frozen-lockfile
            pnpm rebuild node-pty || true
            mapfile -t PTP_DIRS < <(
              find node_modules/.pnpm -mindepth 1 -maxdepth 1 -type d -name 'node-pty@*' -print | LC_ALL=C sort
            )
            if [ "${#PTP_DIRS[@]}" -ne 1 ]; then
              echo "expected exactly one node-pty package, found ${#PTP_DIRS[@]}" >&2
              exit 1
            fi
            PTP="${PTP_DIRS[0]}/node_modules/node-pty"
            echo "=== pty 包路径探测 ==="
            printf '%s\n' "${PTP_DIRS[@]}"
            echo "=== build 目录内容 ==="
            if [ -d "$PTP/build" ]; then
              find "$PTP/build" -maxdepth 2 -type f -print | sed -n '1,30p'
            fi
            mkdir -p "$PTP/prebuilds/linux-arm64"
            if [ ! -s "$PTP/prebuilds/linux-arm64/pty.node" ]; then
              test -s "$PTP/build/Release/pty.node"
              cp "$PTP/build/Release/pty.node" "$PTP/prebuilds/linux-arm64/pty.node"
            fi
            if [ -s "$PTP/build/Release/spawn-helper" ] && [ ! -e "$PTP/prebuilds/linux-arm64/spawn-helper" ]; then
              cp "$PTP/build/Release/spawn-helper" "$PTP/prebuilds/linux-arm64/spawn-helper"
            fi
            chmod +x "$PTP/prebuilds/linux-arm64/spawn-helper" 2>/dev/null || true
            test -s "$PTP/prebuilds/linux-arm64/pty.node"
            ls -la "$PTP/prebuilds/linux-arm64/"
          ) 2>&1 | tee /tmp/step.log
          STATUS="$?"
          set -e
          if [ "$STATUS" != 0 ]; then exit 1; fi

      - name: Check mobile adaptation anchors in the runtime plugin tree
        run: node harness-web/scripts/check-runtime-anchors.mjs /tmp/dsh-root/node_modules

      - name: Download pinned rootfs inputs
        run: |
          curl -fL --retry 3 -o /tmp/ubuntu.tar.gz https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.4-base-arm64.tar.gz
          curl -fL --retry 3 -o /tmp/node.tar.xz https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-arm64.tar.xz
          echo "04207713ece899c3740823d33690441ad3a7f0ded1101aca744e2b0f37ac7ff2  /tmp/ubuntu.tar.gz" | sha256sum -c -
          echo "01443c1e1a29e531ccad5a46fefa6df490d2189c49f7955904aecdbb0fe86fdc  /tmp/node.tar.xz" | sha256sum -c -

      - name: Install toolchain (python standalone + apt static/dynamic binaries)
        run: |
          set -euo pipefail
          mkdir -p /tmp/toolchain/bin /tmp/toolchain/python
          curl -fL --retry 3 -o /tmp/py.tgz https://github.com/astral-sh/python-build-standalone/releases/download/20250712/cpython-3.13.5%2B20250712-aarch64-unknown-linux-gnu-install_only.tar.gz
          echo "d3b6805d8a12610d45917aa5cac69f53f8dd1ee3faef86fc8d2d1488825edd9a  /tmp/py.tgz" | sha256sum -c -
          tar -xzf /tmp/py.tgz -C /tmp/toolchain/python --strip-components=1
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends busybox-static jq unzip
          cp /bin/busybox /tmp/toolchain/bin/busybox
          cp "$(command -v jq)" /tmp/toolchain/bin/jq
          cp "$(command -v unzip)" /tmp/toolchain/bin/unzip
          /tmp/toolchain/bin/busybox >/dev/null 2>&1 || true
          /tmp/toolchain/bin/jq --version
          ls /tmp/toolchain/python/bin | head -5

      - name: Stage network tool component (git / curl / CA / openssh-client)
        run: |
          set -euo pipefail
          bash scripts/stage-network-tools.sh /tmp/network-tools /tmp/ubuntu.tar.gz /tmp/network-tools-packages.txt
          head -20 /tmp/network-tools-packages.txt

      - name: 预置 C 编译工具组件（gcc / g++ / make / 头文件）
        run: |
          set -euo pipefail
          python3 scripts/stage-build-tools.py \
            /tmp/build-tools /tmp/ubuntu.tar.gz /tmp/build-tools-packages.txt
          cc --version | head -n1
          make --version | head -n1
          cat > /tmp/build-tools-smoke.c <<'EOF'
          #include <stdio.h>
          int main(void) { puts("dsh-build-tools-ok"); return 0; }
          EOF
          cc /tmp/build-tools-smoke.c -o /tmp/build-tools-smoke
          /tmp/build-tools-smoke
          head -20 /tmp/build-tools-packages.txt

      - name: Collect Ubuntu package copyright notices for the APK legal bundle
        run: |
          set -euo pipefail
          cat /tmp/network-tools-packages.txt /tmp/build-tools-packages.txt \
            | LC_ALL=C sort -u > /tmp/runtime-packages.txt
          python3 scripts/legal-notices.py collect \
            --dest android/app/src/main/assets/legal/ubuntu-packages \
            --packages /tmp/runtime-packages.txt
          ls -la android/app/src/main/assets/legal/ubuntu-packages/

      - name: Upload legal notices (Ubuntu package copyrights)
        uses: actions/upload-artifact@v4
        with:
          name: runtime-legal
          path: android/app/src/main/assets/legal/ubuntu-packages/
          if-no-files-found: error

      - name: Package Ubuntu git corresponding source
        run: |
          set -euo pipefail
          APT_HOST_ROOT="${DSH_APT_HOST_ROOT:-/etc/apt}"
          APT_WORK_ROOT="${DSH_APT_WORK_ROOT:-/tmp}"
          NETWORK_PACKAGES_FILE="${DSH_NETWORK_PACKAGES_FILE:-/tmp/network-tools-packages.txt}"
          GIT_SOURCE_ARCHIVE="${DSH_GIT_SOURCE_ARCHIVE:-ubuntu-git-corresponding-source.tar.gz}"
          GIT_SOURCE_ROOT="$APT_WORK_ROOT/git-source"
          SOURCEPARTS="$APT_WORK_ROOT/ubuntu-sourceparts"
          PPA_SOURCEPARTS="$APT_WORK_ROOT/ubuntu-git-sourceparts"
          EMPTY_SOURCES="$APT_WORK_ROOT/ubuntu-empty-sources.list"
          GIT_SOURCE_TAR="$APT_WORK_ROOT/git-source.tar"
          rm -rf "$GIT_SOURCE_ROOT" "$SOURCEPARTS" "$PPA_SOURCEPARTS" "$EMPTY_SOURCES" "$GIT_SOURCE_TAR"
          mkdir -p "$GIT_SOURCE_ROOT/files" "$SOURCEPARTS" "$PPA_SOURCEPARTS"
          found=0
          : > "$EMPTY_SOURCES"
          source_index=0
          if [ -f "$APT_HOST_ROOT/sources.list" ]; then
            source_index=$((source_index + 1))
            sed -E \
              -e 's/^([[:space:]]*)deb([[:space:]]+)/\1deb-src\2/' \
              -e 's/arch(\+)?=[^[:space:]]+[[:space:]]*//g' \
              "$APT_HOST_ROOT/sources.list" > "$SOURCEPARTS/ubuntu-${source_index}.list"
            found=1
          fi
          for source_file in "$APT_HOST_ROOT"/sources.list.d/*.list; do
            [ -f "$source_file" ] || continue
            source_index=$((source_index + 1))
            sed -E \
              -e 's/^([[:space:]]*)deb([[:space:]]+)/\1deb-src\2/' \
              -e 's/arch(\+)?=[^[:space:]]+[[:space:]]*//g' \
              "$source_file" > "$SOURCEPARTS/ubuntu-${source_index}.list"
            found=1
          done
          for source_file in "$APT_HOST_ROOT"/sources.list.d/*.sources; do
            [ -f "$source_file" ] || continue
            source_index=$((source_index + 1))
            awk '
              /^[[:space:]]*Architectures(-Add|-Remove)?:[[:space:]]*/ { next }
              /^[[:space:]]*Types:[[:space:]]*/ {
                if ($0 !~ /(^|[[:space:]]*)deb-src([[:space:]]|$)/) {
                  sub(/[[:space:]]*$/, "")
                  $0 = $0"  deb-src"
                }
              }
              { print }
            ' "$source_file" > "$SOURCEPARTS/ubuntu-${source_index}.sources"
            found=1
          done
          test "$found" = 1
          test -n "$(find "$SOURCEPARTS" -type f -size +0c -print -quit)"
          for source_file in "$SOURCEPARTS"/*; do
            [ -f "$source_file" ] || continue
            if grep -qi 'git-core/ppa' "$source_file"; then
              cp "$source_file" "$PPA_SOURCEPARTS/"
            fi
          done
          PPA_SOURCE_FILE="$(find "$PPA_SOURCEPARTS" -type f -size +0c -print -quit)"
          if [ -z "$PPA_SOURCE_FILE" ]; then
            PPA_URI="$(apt-cache policy git | sed -n 's/^[[:space:]]*[0-9][0-9]*[[:space:]]\+\(https\?:\/\/[^[:space:]]*launchpad[^[:space:]]*\) .*/\1/p' | head -n1 || true)"
            PPA_URI="${PPA_URI:-https://ppa.launchpadcontent.net/git-core/ppa/ubuntu}"
            PPA_SUITE="${VERSION_CODENAME:-noble}"
            PPA_KEYRING="$APT_WORK_ROOT/git-core-ppa.gpg"
            : > "$PPA_KEYRING"
            for key in F911AB184317630C59970973E363C90F8F1B6217 E1DD270288B4E6030699E45FA1715D88E1DF1F24; do
              key_file="$APT_WORK_ROOT/ppa-${key}.asc"
              key_bin="$APT_WORK_ROOT/ppa-${key}.gpg"
              curl -fsSL --retry 3 --connect-timeout 20 \
                "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x${key}&options=mr&exact=on" \
                -o "$key_file"
              gpg --batch --dearmor --yes --output "$key_bin" "$key_file"
              gpg --batch --show-keys --with-colons "$key_bin" \
                | awk -F: -v expected="$key" \
                  'toupper($1) == "FPR" && toupper($10) == expected { found=1 } END { exit !found }'
              cat "$key_bin" >> "$PPA_KEYRING"
            done
            printf 'deb-src [arch=amd64 signed-by=%s] %s %s main\n' \
              "$PPA_KEYRING" "$PPA_URI" "$PPA_SUITE" > "$PPA_SOURCEPARTS/derived.list"
          fi
          test -n "$(find "$PPA_SOURCEPARTS" -type f -size +0c -print -quit)"
          SOURCE_APT_OPTS=(-o "Dir::Etc::sourcelist=$EMPTY_SOURCES" -o "Dir::Etc::sourceparts=$PPA_SOURCEPARTS" -o APT::Architecture=amd64)
          sudo apt-get "${SOURCE_APT_OPTS[@]}" update -qq
          GIT_SOURCE_RECORD="$(dpkg-query -W -f='${source:Package}\t${source:Version}\n' git)"
          IFS=$'\t' read -r GIT_SOURCE_PACKAGE GIT_SOURCE_VERSION <<< "$GIT_SOURCE_RECORD"
          test -n "$GIT_SOURCE_PACKAGE"
          test -n "$GIT_SOURCE_VERSION"
          SOURCE_REQUEST="$GIT_SOURCE_PACKAGE"
          (cd "$GIT_SOURCE_ROOT/files" && apt-get "${SOURCE_APT_OPTS[@]}" source --download-only "$SOURCE_REQUEST")
          SOURCE_DSC="$(find "$GIT_SOURCE_ROOT/files" -maxdepth 1 -type f -name '*.dsc' -print -quit)"
          test -n "$SOURCE_DSC"
          SOURCE_NAME="$(sed -n 's/^Source: //p' "$SOURCE_DSC" | head -n 1)"
          SOURCE_VERSION="$(sed -n 's/^Version: //p' "$SOURCE_DSC" | head -n 1)"
          test "$SOURCE_NAME" = "$GIT_SOURCE_PACKAGE"
          test "$SOURCE_VERSION" = "$GIT_SOURCE_VERSION"
          test -n "$(find "$GIT_SOURCE_ROOT/files" -maxdepth 1 -type f \( -name '*.orig.tar.*' -o -name '*.debian.tar.*' \) -print -quit)"
          dpkg-query -W -f='${Package}\t${Version}\t${Architecture}\n' \
            $(tr '\n' ' ' < "$NETWORK_PACKAGES_FILE") > "$GIT_SOURCE_ROOT/package-versions.txt"
          printf '%s\n' "installed=${GIT_SOURCE_PACKAGE}=${GIT_SOURCE_VERSION}" "source=${SOURCE_REQUEST}=${SOURCE_VERSION}" > "$GIT_SOURCE_ROOT/README.txt"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf "$GIT_SOURCE_TAR" -C "$GIT_SOURCE_ROOT" files package-versions.txt README.txt
          gzip -n -c "$GIT_SOURCE_TAR" > "$GIT_SOURCE_ARCHIVE"
          test -s "$GIT_SOURCE_ARCHIVE"

      - name: Build bundle + manifest (mobile profile)
        run: |
          set -o pipefail
          set +e
          (
            set -e
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.release_type }}" = "stable" ]; then
              RUNTIME_VERSION="${APP_VERSION}"
              RELEASE_TAG="v${APP_VERSION}"
            else
              RUNTIME_VERSION="${APP_VERSION}-mobile-${GITHUB_RUN_NUMBER}"
              RELEASE_TAG="v${RUNTIME_VERSION}-personal"
            fi
            python3 scripts/build-embedded-runtime.py \
              --ubuntu /tmp/ubuntu.tar.gz --ubuntu-sha256 04207713ece899c3740823d33690441ad3a7f0ded1101aca744e2b0f37ac7ff2 \
              --node /tmp/node.tar.xz --node-sha256 01443c1e1a29e531ccad5a46fefa6df490d2189c49f7955904aecdbb0fe86fdc \
              --dsh-root /tmp/dsh-root --toolchain-dir /tmp/toolchain --runtime-version "${RUNTIME_VERSION}" \
              --network-tools-dir /tmp/network-tools \
              --build-tools-dir /tmp/build-tools \
              --rootfs-url "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/rootfs.bundle" \
              --mobile-profile scripts/mobile-profile.example.json \
              --output /tmp/rootfs.bundle --manifest /tmp/runtime-manifest.json
            python3 scripts/rebuild-rootfs-frontend.py \
              --bundle /tmp/rootfs.bundle \
              --manifest /tmp/runtime-manifest.json \
              --dist harness-web/dist \
              --runtime-version "${RUNTIME_VERSION}"
            ls -la /tmp/rootfs.bundle /tmp/runtime-manifest.json
            sha256sum /tmp/rootfs.bundle
            python3 scripts/verify-bundle.py --bundle /tmp/rootfs.bundle --manifest /tmp/runtime-manifest.json
            mkdir -p runtime-artifacts
            cp /tmp/rootfs.bundle /tmp/runtime-manifest.json runtime-artifacts/
          ) 2>&1 | tee /tmp/bundle.log
          STATUS="$?"
          set -e
          if [ "$STATUS" != 0 ]; then
            echo "=== bundle step failed, see /tmp/bundle.log (folded into verify log) ==="
            cat /tmp/bundle.log
            exit 1
          fi

      - name: Verify runtime artifacts before upload
        run: |
          {
            pwd
            echo "=== node-pty step output ==="
            cat /tmp/step.log 2>/dev/null || echo "(无 step.log)"
            echo "=== dsh-root 探测 ==="
            ls -la /tmp/dsh-root/node_modules/@deepseek-ai/dsh/lib/bin.js 2>/dev/null || echo "(dsh bin.js 缺失)"
            find /tmp/dsh-root/node_modules/.pnpm -path '*/node-pty/prebuilds/linux-arm64/pty.node' -ls 2>/dev/null || echo "(pty 目录缺失)"
            echo "=== bundle step output ==="
            cat /tmp/bundle.log 2>/dev/null || echo "(无 bundle.log)"
            echo "=== runtime-artifacts ==="
            ls -la runtime-artifacts/ || true
            du -sh runtime-artifacts/ 2>/dev/null || true
          } 2>&1 | tee /tmp/verify.log
          if [ ! -f runtime-artifacts/rootfs.bundle ] || [ ! -f runtime-artifacts/runtime-manifest.json ]; then
            echo "runtime artifacts are missing; inspect this Actions step output" >&2
            exit 1
          fi
          node scripts/check-runtime-dedupe.mjs --list /tmp/dsh-root

      - name: Validate generated runtime manifest
        run: |
          node scripts/validate-manifests.mjs \
            --file runtime-artifacts/runtime-manifest.json \
            --schema scripts/schemas/runtime-manifest.schema.json

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: embedded-runtime
          path: |
            runtime-artifacts/rootfs.bundle
            runtime-artifacts/runtime-manifest.json
          if-no-files-found: error

      - name: Upload Ubuntu git corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-git-corresponding-source
          path: ubuntu-git-corresponding-source.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish release (APK + rootfs bundle + manifest)
    needs: [build, build-rootfs, gates]
    permissions:
      contents: write
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_type != '' && (github.event.inputs.release_type != 'stable' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-harness-android-release
          path: /tmp/apk

      - name: Download runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: embedded-runtime
          path: /tmp/runtime

      - name: Download corresponding source materials
        uses: actions/download-artifact@v4
        with:
          name: proot-corresponding-source
          path: /tmp/proot-source

      - name: Download Ubuntu git source materials
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-git-corresponding-source
          path: /tmp/git-source

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -o pipefail
          set +e
          cd "$GITHUB_WORKSPACE"
          (
            set -e
            RELEASE_TYPE="${{ github.event.inputs.release_type }}"
            if [ -z "$RELEASE_TYPE" ]; then RELEASE_TYPE="preview"; fi
            if [ "$RELEASE_TYPE" = "stable" ]; then
              TAG="v${APP_VERSION}"
              NAME="DeepSeek Harness Android v${APP_VERSION}（正式版 · 个人构建）"
              PRE="false"
            else
              TAG="v${APP_VERSION}-mobile-${{ github.run_number }}-personal"
              NAME="DeepSeek Harness Android v${APP_VERSION} 个人构建 #${{ github.run_number }}"
              PRE="true"
            fi
            APK="$(ls /tmp/apk/*.apk | head -n1)"
            test -n "$APK"
            test -f /tmp/runtime/rootfs.bundle
            test -f /tmp/runtime/runtime-manifest.json
            test -s /tmp/proot-source/proot-corresponding-source.tar.gz
            test -s /tmp/git-source/ubuntu-git-corresponding-source.tar.gz
            SOURCE_DIR="$(mktemp -d)"
            trap 'rm -rf "$SOURCE_DIR" /tmp/corresponding-source.tar' EXIT
            cp /tmp/proot-source/proot-corresponding-source.tar.gz "$SOURCE_DIR/"
            cp /tmp/git-source/ubuntu-git-corresponding-source.tar.gz "$SOURCE_DIR/"
            git archive --format=tar --prefix=build-and-install-materials/ HEAD \
              -- scripts .github/workflows/android-build.yml LICENSE THIRD_PARTY_NOTICES.md README.md \
              | gzip -n > "$SOURCE_DIR/build-and-install-materials.tar.gz"
            test -s "$SOURCE_DIR/build-and-install-materials.tar.gz"
            printf '%s\n' \
              "# Corresponding source for ${TAG} (personal build)" \
              '' \
              'This archive is the complete, no-charge corresponding source and build' \
              'material for the GPL/AGPL-covered PRoot and Operit runtime files and the' \
              'Ubuntu git package conveyed by this release. It includes the pinned' \
              'source archives, Debian source package, patches, and self-contained' \
              'build/install scripts and CI inputs.' \
              > "$SOURCE_DIR/OFFER.md"
            python3 scripts/create-corresponding-source-manifest.py \
              --dir "$SOURCE_DIR" --out "$SOURCE_DIR/SOURCE_MANIFEST.json"
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -cf /tmp/corresponding-source.tar -C "$SOURCE_DIR" \
              SOURCE_MANIFEST.json OFFER.md proot-corresponding-source.tar.gz ubuntu-git-corresponding-source.tar.gz build-and-install-materials.tar.gz
            gzip -n -c /tmp/corresponding-source.tar > /tmp/corresponding-source.tar.gz
            python3 scripts/verify-corresponding-source.py --archive /tmp/corresponding-source.tar.gz
            MANIFEST_SHA="$(sha256sum /tmp/runtime/runtime-manifest.json | cut -d' ' -f1)"
            PREV_TAG="$(git tag --list 'v*' --sort=-creatordate | head -n1 || true)"
            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..${GITHUB_SHA}"
            else
              RANGE="${GITHUB_SHA}"
            fi
            CHANGES="$(git log --no-merges --pretty=format:'- %s' "$RANGE" 2>/dev/null | head -n 40 || true)"
            if [ -z "$CHANGES" ]; then
              CHANGES="- （个人 fork 的首次云端构建）"
            fi
            if [ -n "$PREV_TAG" ]; then
              CHANGES_HEADER="上一个版本：${PREV_TAG}"
            else
              CHANGES_HEADER="（未找到上一个发布标签）"
            fi
            python3 scripts/release-manifest.py \
              --version "${APP_VERSION}" \
              --tag "$TAG" \
              --release-type "$RELEASE_TYPE" \
              --commit "$GITHUB_SHA" \
              --apk "$APK" \
              --bundle /tmp/runtime/rootfs.bundle \
              --runtime-manifest /tmp/runtime/runtime-manifest.json \
              --corresponding-source /tmp/corresponding-source.tar.gz \
              --out /tmp/release-manifest.json
            for f in "$APK" /tmp/runtime/rootfs.bundle /tmp/runtime/runtime-manifest.json /tmp/corresponding-source.tar.gz /tmp/release-manifest.json; do
              printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
            done > /tmp/checksums.txt
            {
              printf '%s\n' "# ${NAME}" '' '## 个人构建说明' '' \
                '- 本 APK 由个人 fork 的 GitHub Actions 云端构建，使用个人专用 keystore 签名（非官方团队签名）。' \
                '- keystore 密码：dsh-personal-2026；keystore 文件在本次运行的 personal-keystore 构件中，必须下载备份。' \
                '- targetSdk 35、arm64-v8a、内置 Ubuntu 24.04 ARM64 + Node 24.19 + dsh 0.2.1-rc.1 运行时，可离线安装。' '' '## 变更内容' '' "${CHANGES_HEADER}" '' \
                "${CHANGES}"
            } > /tmp/notes.md
            RESP="$(curl -sS -f -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/releases \
              -d "$(jq -n --arg t "$TAG" --arg n "$NAME" --arg pre "$PRE" --arg sha "$GITHUB_SHA" --rawfile b /tmp/notes.md '{tag_name:$t, target_commitish:$sha, name:$n, body:$b, draft:true, prerelease:($pre=="true")}')")"
            RELEASE_ID="$(echo "$RESP" | jq -r .id)"
            [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
            {
              echo "RELEASE_TAG=${TAG}"
              echo "RELEASE_ID=${RELEASE_ID}"
            } >> "$GITHUB_ENV"
            UPLOAD_BASE="https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets"
            for f in "$APK" /tmp/runtime/rootfs.bundle /tmp/runtime/runtime-manifest.json /tmp/corresponding-source.tar.gz /tmp/release-manifest.json /tmp/checksums.txt; do
              name="$(basename "$f")"
              curl -sS -f -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$f" \
                "${UPLOAD_BASE}?name=${name}" >/dev/null
            done
          ) 2>&1 | tee /tmp/release.log
          STATUS="$?"
          set -e
          if [ "$STATUS" != 0 ]; then exit 1; fi

      - name: 复核草稿资产（重新下载并核对摘要）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_TAG:-}"
          VERIFY_DIR="$(mktemp -d)"
          gh release download "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --dir "${VERIFY_DIR}" \
            --pattern '*'
          ls -la "${VERIFY_DIR}"
          python3 scripts/verify-release-assets.py \
            --dir "${VERIFY_DIR}" \
            --expect app-release.apk,rootfs.bundle,runtime-manifest.json,corresponding-source.tar.gz,release-manifest.json
          python3 scripts/verify-corresponding-source.py \
            --archive "${VERIFY_DIR}/corresponding-source.tar.gz"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -euo pipefail
          [[ "${RELEASE_ID:-}" =~ ^[0-9]+$ ]]
          test -n "${RELEASE_TAG:-}"
          curl -sS -f -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"draft":false}' \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}" >/dev/null
          echo "RELEASE_URL=https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"

      - name: 失败回退：保持本次发布为草稿
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -euo pipefail
          if [[ ! "${RELEASE_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "本次尚未创建 Release，无需撤回"
            exit 0
          fi
          curl -sS -f -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"draft":true}' \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}" >/dev/null
          echo "已把 ${RELEASE_TAG} 转为草稿"

  gates:
    name: Quality gates (whitespace / Android resources / manifest schema / secrets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Check whitespace in the pushed range
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "取不到本次推送的基线提交（新建分支 / 强推 / 手工触发），退回只比 HEAD 上一提交"
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "${BASE}" ]; then
            echo "::notice::仓库只有 HEAD 一个提交，没有可比区间，跳过 git diff --check"
            exit 0
          fi
          echo "比较区间：${BASE}..${HEAD_SHA}"
          git diff --check "${BASE}" "${HEAD_SHA}"
          echo "git diff --check 通过：区间内没有行尾空白 / 冲突标记 / 多余空行"

      - name: Check Android resources
        run: python3 scripts/check-android-resources.py

      - name: Validate manifests against schemas
        run: node scripts/validate-manifests.mjs

      - name: Scan the pushed range for credentials (gitleaks)
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          bash scripts/ci-gitleaks-range-scan.sh \
            --gitleaks /tmp/gitleaks \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.sha }}"
